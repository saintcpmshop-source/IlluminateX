name: Build IlluminateX PKG

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake bison flex gcc libelf-dev make texinfo libncurses5-dev patch python3 wget zlib1g-dev libtool python3-dev bzip2 libgmp3-dev pkg-config g++ libssl-dev clang

    - name: Build PKG
      run: |
        chmod +x build.sh
        ./build.sh
